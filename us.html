<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Job status · 応募状況</title>
<style>
:root{color-scheme:light;--ink:#17324a;--muted:#53687b;--blue:#1e4265;--line:#d5e0e9;--paper:#f4f7fa;--teal:#067168}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "Yu Gothic UI","Hiragino Kaku Gothic ProN",system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}:focus-visible{outline:3px solid #ce8b20}button,a,summary{touch-action:manipulation}button{cursor:pointer;padding:10px 16px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--blue)}a{color:#185b89;text-underline-offset:3px}input,select,textarea{border:1px solid #abbccb;border-radius:7px;padding:11px 12px;background:white;max-width:100%;min-width:0;color:var(--ink)}[hidden]{display:none!important}
.gate{max-width:620px;margin:12vh auto;padding:30px}.gate h1{font-size:32px;margin:0 0 10px}.gate p{color:var(--muted)}.gate form{display:flex;gap:10px;flex-wrap:wrap}.gate input{flex:1;min-width:170px}.primary{background:var(--blue);color:white}.privacy{font-size:13px}.message{min-height:27px;color:#9b3040}.appbar{background:white;border-bottom:1px solid var(--line)}.bar-inner{max-width:1480px;margin:auto;padding:14px 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}.brand{font:700 17px/1.2 "Bahnschrift",system-ui,sans-serif;letter-spacing:.04em}.navigation{display:flex;gap:6px}.navigation a{display:flex;align-items:center;min-height:44px;padding:8px 14px;text-decoration:none;border-radius:7px;font-weight:600}.navigation a[aria-current=page]{background:var(--blue);color:white}.controls{display:flex;gap:8px;align-items:center;margin-left:auto}.language{display:flex;gap:2px}.language button{font-size:14px;padding:8px 12px}.language button[aria-pressed=true]{background:#e7f4f1;border-color:#74aaa0;color:#005a51}
main{max-width:1480px;margin:auto;padding:32px 28px 60px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}.eyebrow{font:12px/1.5 Consolas,monospace;letter-spacing:.12em;color:var(--teal)}h1{font-size:clamp(25px,4vw,38px);line-height:1.3;letter-spacing:-.035em;margin:8px 0}h2,h3,p{margin:0}h2{font-size:21px;line-height:1.45}.muted{color:var(--muted)}.updated{font-size:13px;max-width:350px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:24px}.metric{padding:15px 20px;background:white}.metric b{display:block;font:600 29px/1.3 "Bahnschrift",system-ui,sans-serif}.metric span{font-size:13px;color:var(--muted)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 12px}.filters input{flex:1;min-width:200px}.filters select{max-width:360px}.count{font-size:14px;margin:12px 0;color:var(--muted)}.notice{padding:12px 16px;border-left:3px solid var(--teal);background:#eaf3f3;font-size:14px;margin:16px 0}
.position{display:grid;grid-template-columns:minmax(230px,1fr) minmax(250px,1.65fr) minmax(170px,.65fr);gap:24px;padding:24px;background:white;border:1px solid var(--line);border-radius:9px;margin-bottom:14px;overflow-wrap:anywhere}.role{font-size:14px;color:var(--muted);margin:5px 0 12px}.label{display:block;font-size:12px;letter-spacing:.035em;font-weight:700;color:var(--muted);margin-bottom:6px}.deadline{font-weight:600}.links{display:flex;gap:8px 16px;flex-wrap:wrap;margin-top:14px}.links a{font-size:14px;min-height:32px;padding:3px 0}.badge{display:inline-block;border-radius:5px;padding:3px 8px;background:#edf2f7;font-size:12px;margin:0 5px 6px 0}.badge.action{background:#fff1d5;color:#805113}.badge.done{background:#e6f4ef;color:#005c4d}details{margin-top:14px}summary{cursor:pointer;min-height:40px;color:#315d7b;font-size:14px;padding:7px 0}.detail{font-size:14px;padding-top:8px}.detail p{margin:0 0 10px}.note{width:100%;min-height:80px;resize:vertical}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.action-card{padding:18px;background:white;border:1px solid var(--line);border-radius:8px}.action-card h3{font-size:16px;margin-bottom:6px}.action-card p{font-size:14px;color:var(--muted)}.empty{padding:30px;background:white;text-align:center;border:1px solid var(--line)}footer{font-size:12px;color:var(--muted);margin-top:24px}.original{font-size:11px;color:var(--muted)}
.table-scroll{overflow-x:auto;margin:12px 0 24px;background:white;border:1px solid var(--line);border-radius:8px}.portal-table{width:100%;min-width:960px;border-collapse:collapse;font-size:14px;text-align:left}.portal-table td,.portal-table th{padding:12px;vertical-align:top;border-bottom:1px solid var(--line)}.portal-table td{min-width:150px;overflow-wrap:anywhere}.portal-table p+p{margin-top:8px}#review-status p+p{margin-top:8px}.review-accounts{display:grid;gap:8px;margin-top:12px}.review-account{padding:8px 0;border-bottom:1px solid var(--line)}.review-gap{border-left:3px solid #ad7015;padding-left:10px;margin:10px 0}.stale{color:#923216;font-weight:600}
@media(max-width:900px){.position{grid-template-columns:minmax(180px,.8fr) minmax(0,1.2fr)}.timing{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px}.heading{align-items:start;flex-direction:column;gap:8px}.bar-inner{gap:8px}.brand{display:none}}
@media(max-width:600px){.gate{margin:7vh auto;padding:24px 18px}.gate form{display:grid}.gate input{width:100%}.bar-inner{padding:10px 14px}.navigation{width:100%}.navigation a{flex:1;justify-content:center}.controls{margin-left:0;width:100%;justify-content:space-between}main{padding:24px 14px 40px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:12px 14px}.metric b{font-size:26px}.filters{display:grid;grid-template-columns:minmax(0,1fr)}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters input,.filters select{width:100%;min-width:0;max-width:none;grid-column:1/-1}.position{display:block;padding:18px 16px}.position>div+div{margin-top:18px}.position h2{font-size:20px}.timing{padding-top:14px}.actions{grid-template-columns:minmax(0,1fr)}.links a{min-height:44px;display:inline-flex;align-items:center}input,select,textarea{font-size:16px}.updated{max-width:100%}}

</style></head><body>
<section class="gate" id="gate"><div class="eyebrow">CAREER / 2027</div><h1>応募状況・Job status</h1><p>パスワードを入力して開く / Enter your access password.</p><form id="unlock-form"><label for="password" hidden>Access password / パスワード</label><input id="password" type="password" autocomplete="off" required placeholder="パスワード / Password"><button class="primary" type="submit">開く / Unlock</button></form><p id="message" class="message" role="status" aria-live="polite"></p><p class="privacy">パスワードはこのブラウザー内でのみ使用します。<br>Your password decrypts the dashboard in this browser and is never sent to GitHub.</p></section>
<div id="app" hidden><header class="appbar"><div class="bar-inner"><span class="brand">CAREER / 2027</span><nav class="navigation" aria-label="Dashboards"><a href="./" data-page="bcf">BCF</a><a href="./us.html" data-page="us">U.S. positions</a></nav><div class="controls"><div class="language" id="language" aria-label="BCF language"><button data-lang="ja" aria-pressed="true">日本語</button><button data-lang="en" aria-pressed="false">English</button></div><button id="lock">ロック / Lock</button></div></div></header><main><div class="heading"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p class="muted" id="subtitle"></p></div><p class="updated muted" id="updated"></p></div><section id="metrics" class="metrics" aria-label="Summary"></section><div id="notice" class="notice"></div><section id="review-status" class="notice" aria-label="Email review coverage"></section><details id="portal-section"><summary id="portal-title"></summary><div id="portal-logins" class="table-scroll"></div></details><details id="action-section" hidden><summary id="action-title"></summary><div id="actions" class="actions"></div></details><div class="filters"><input id="search" type="search"><select id="filter"></select><button id="reset"></button><button id="export"></button></div><p id="count" class="count" aria-live="polite"></p><section id="positions" aria-label="Positions"></section><footer id="footer"></footer></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=null,page=location.pathname.endsWith('/us.html')?'us':'bcf',lang='ja';
try{lang=localStorage.getItem('job-status-language')==='en'?'en':'ja';}catch{}
const isJa=()=>page==='bcf'&&lang==='ja',ui=(ja,en)=>isJa()?ja:en,tr=s=>isJa()?(data.ja?.[s]??s):s;
const field=s=>esc(tr(s))+(isJa()&&s&&/[a-z]{3}/i.test(s)&&!data.ja?.[s]?'<span class="original"> · 原文</span>':'');
function safeLink(url,label){try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))return '';return `<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;}catch{return '';}}
const bytes=v=>Uint8Array.from(atob(v),c=>c.charCodeAt(0));
async function decrypt(password){const response=await fetch(`./status.enc.json?v=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw Error('payload');const e=await response.json();if(e.version!==1||e.kdf!=='PBKDF2-SHA256'||e.iterations<600000)throw Error('format');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(e.salt),iterations:e.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const c=bytes(e.ciphertext),tag=bytes(e.tag),combined=new Uint8Array(c.length+tag.length);combined.set(c);combined.set(tag,c.length);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(e.iv),tagLength:128},key,combined);const payload=JSON.parse(new TextDecoder().decode(clear));if(!payload.data?.bcf?.rows||!payload.data?.us?.roles)throw Error('content');return payload.data;}
const metric=(n,label)=>`<div class="metric"><b>${esc(n)}</b><span>${esc(label)}</span></div>`;
function displayTime(value){if(!value)return ui('未確認','Not verified');const date=new Date(value);return Number.isNaN(date.getTime())?String(value):new Intl.DateTimeFormat(isJa()?'ja-JP':'en-US',{timeZone:'America/Los_Angeles',dateStyle:'medium',timeStyle:'short'}).format(date)+' (Los Angeles)';}
function renderReview(){const source=data[page],coverage=source.reviewCoverage||{},gaps=coverage.gaps||[],stamp=source.lastEmailReviewAt||source.updatedAt;const stale=!stamp||Number.isNaN(Date.parse(stamp))||Date.now()-Date.parse(stamp)>8*60*60*1000;
$('review-status').innerHTML=`<h2>${ui('メール確認状況','Email review status')}</h2><p>${ui('最新レビュー: ','Latest review: ')}${esc(displayTime(stamp))}</p>${stale?`<p class="stale">${ui('最新の確認から8時間以上経過しているか、確認日時が不明です。未確認の更新がある可能性があります。','The latest review is over eight hours old or its time is unknown. New updates may be unreviewed.')}</p>`:''}${gaps.length?`<p class="review-gap"><b>${ui('未確認項目あり','Review gaps remain')}</b></p><ul>${gaps.map(g=>`<li>${field(g)}</li>`).join('')}</ul>`:''}<details><summary>${ui('今回確認した内容・メールボックス別の記録','What was reviewed and mailbox checkpoints')}</summary><p>${field(source.latestEmailReview||'No review summary available.')}</p><div class="review-accounts">${(coverage.accounts||[]).map(a=>`<div class="review-account"><b>${esc(a.email)}</b><p>${ui('最終試行: ','Last attempt: ')}${esc(displayTime(a.lastAttemptAt))} · ${field(a.outcome)}</p><p>${ui('本人確認: ','Identity verified: ')}${esc(displayTime(a.accessVerifiedAt))}<br>${ui('最後の完全確認記録: ','Last recorded complete scan: ')}${esc(displayTime(a.lastCompleteCheckAt))}</p></div>`).join('')}</div></details>`;
const portals=data.bcf.myPageEntries||[];$('portal-section').hidden=page!=='bcf';$('portal-title').textContent=ui('マイページ・ログイン情報と必要な対応','MyPage logins and required actions')+' · '+portals.length;
$('portal-logins').innerHTML=`<table class="portal-table"><thead><tr>${[ui('企業・ログインID','Company / login ID'),ui('パスワード・設定状況','Password / setup status'),ui('必要な対応','Required action'),ui('期限','Deadline'),ui('元メール・確認日時','Source / check times')].map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${portals.map(p=>`<tr><td><b>${field(p.company)}</b><p>${safeLink(p.portalUrl,ui('マイページを開く','Open portal'))}</p><p>ID: ${esc(p.applicantId||ui('未発行・未確認','Not issued / not verified'))}</p></td><td>${field(p.passwordStatus)}<p>${field(p.status)}</p></td><td>${field(p.nextAction)}</td><td>${field(p.deadline||ui('期限の記載なし','No deadline stated'))}</td><td>${esc(p.sourceAccount)}<p>${safeLink(p.emailUrl,ui('ログイン情報の元メール','Source email for login details'))}</p><p>${ui('最終確認: ','Latest check: ')}${esc(displayTime(p.latestCheckedAt))}</p><p>${ui('ポータル確認: ','Portal verified: ')}${esc(displayTime(p.portalVerifiedAt))}</p></td></tr>`).join('')}</tbody></table>`;}
function setup(){document.documentElement.lang=isJa()?'ja':'en';document.querySelectorAll('[data-page]').forEach(a=>a.setAttribute('aria-current',a.dataset.page===page?'page':'false'));$('language').hidden=page!=='bcf';document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));$('search').value='';$('search').placeholder=ui('企業・職種・次のアクションを検索','Search company, role or next action');$('search').setAttribute('aria-label',$('search').placeholder);$('filter').setAttribute('aria-label',ui('応募状況で絞り込む','Filter by application status'));$('reset').textContent=ui('絞り込みを解除','Reset filters');$('export').textContent=ui('CSVを書き出す','Export CSV');$('eyebrow').textContent=page==='bcf'?'BOSTON CAREER FORUM / 2026':'UNITED STATES / NEW GRAD';$('title').textContent=page==='bcf'?ui('応募状況と次のアクション','Applications and next actions'):'U.S. new-grad positions';$('subtitle').textContent=ui('提出済みの応募、選考の進捗、これから必要な対応。','Application receipts, progress and what to do next.');const source=data[page];const rawDate=source.updatedAt||source.evidenceAsOf||'—';const displayDate=rawDate.includes('T')&&!Number.isNaN(Date.parse(rawDate))?new Intl.DateTimeFormat(isJa()?'ja-JP':'en-US',{timeZone:'America/Los_Angeles',dateStyle:'medium',timeStyle:'short'}).format(new Date(rawDate))+' (Los Angeles)':rawDate;$('updated').textContent=ui('データ更新: ','Data updated: ')+displayDate+' · '+ui('記載のタイムゾーンを確認してください。','Check the timezone shown with each deadline.');
if(page==='bcf'){const rows=source.rows;$('metrics').innerHTML=metric(rows.length,ui('管理中の職種','Positions tracked'))+metric(rows.filter(r=>r.submitted).length,ui('CFN提出済み','CFN submitted'))+metric(rows.filter(r=>r.owner==='You').length,ui('あなたの対応待ち','Needs your action'))+metric(rows.filter(r=>r.owner==='Employer').length,ui('企業からの連絡待ち','Waiting on employer'));$('notice').textContent=ui('「CFN提出済み」はCFNでの手続きの完了を示します。企業のES、適性検査、必須説明会が残っている場合があります。','CFN submitted confirms the CFN step. Employer forms, assessments and mandatory sessions may still remain.');$('filter').innerHTML=[['all','すべて','All tracked'],['you','対応が必要','Needs your action'],['waiting','企業の対応待ち','Waiting on employer'],['submitted','CFN提出済み','CFN submitted'],['unsubmitted','未提出','Not submitted']].map(([v,j,e])=>`<option value="${v}">${esc(ui(j,e))}</option>`).join('');$('action-section').hidden=true;}
else{const rows=source.roles,submitted=rows.filter(r=>r.submittedAt&&['Applied','Assessment','Interview','Offer','Rejected'].includes(r.applicationStatus));const day=new Intl.DateTimeFormat('en-CA',{timeZone:source.timezone||'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('metrics').innerHTML=metric(submitted.filter(r=>r.submittedAt===day).length+' / '+(source.dailyTarget||30),'Submitted today · '+day)+metric(submitted.length,'Confirmed applications')+metric(rows.filter(r=>r.stage==='Draft prepared').length,'Drafts prepared')+metric(rows.length,'Positions tracked');$('notice').textContent=source.scope||'Confirmed status from the saved recruiting evidence.';$('filter').innerHTML='<option value="all">All statuses</option>'+Array.from(new Set(rows.map(r=>r.stage))).map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');$('action-section').hidden=false;$('action-title').textContent='Upcoming actions · '+(source.actions||[]).length;$('actions').innerHTML=(source.actions||[]).map(a=>`<article class="action-card"><h3>${esc(a.title)}</h3><p>${esc(a.text)}</p>${safeLink(a.url,a.label||'Open source')}</article>`).join('');}
$('footer').textContent=ui('メモはこの端末のブラウザーに保存されます。必要に応じてCSVを書き出してください。企業の採用システムとは自動同期しません。','Notes are saved in this browser on this device. Export CSV to keep a copy. This site does not sync with employer portals.');renderReview();render();}
function rowsVisible(){const rows=page==='bcf'?data.bcf.rows:data.us.roles,f=$('filter').value,q=$('search').value.trim().toLocaleLowerCase();return rows.filter(r=>{const match=page==='bcf'?(f==='all'||f==='you'&&r.owner==='You'||f==='waiting'&&r.owner==='Employer'||f==='submitted'&&r.submitted||f==='unsubmitted'&&!r.submitted):(f==='all'||r.stage===f);return match&&(!q||Object.values(r).filter(v=>typeof v==='string').map(s=>s+' '+tr(s)).join(' ').toLocaleLowerCase().includes(q));});}
function render(){const rows=rowsVisible(),total=page==='bcf'?data.bcf.rows.length:data.us.roles.length;$('count').textContent=ui(`${total}件中${rows.length}件を表示`,`${rows.length} of ${total} positions shown`);$('positions').innerHTML=rows.map(r=>{const bcf=page==='bcf';let note='';try{note=localStorage.getItem(`job-status-note-${page}-${r.id}`)||localStorage.getItem(`bcf-note-${r.id}`)||'';}catch{}return `<article class="position"><div><h2>${esc(tr(r.company))}</h2><p class="role">${field(r.role)}</p><span class="badge ${bcf&&r.owner==='You'?'action':''}">${field(bcf?r.status:r.stage)}</span>${bcf?(r.status==='CFN submitted'?'':r.submitted?`<span class="badge done">${ui('CFN提出済み','CFN submitted')}</span>`:`<span class="badge">${ui('未提出','Not submitted')}</span>`):`<span class="badge">${esc(r.applicationStatus||'')}</span>`}${r.location?`<p class="role">${esc(r.location)}</p>`:''}<div class="links">${safeLink(r.url,ui('募集要項','Job posting'))}${safeLink(r.portal,ui('マイページ','Employer portal'))}${safeLink(r.receipt,ui('受付・根拠','Receipt / evidence'))}</div></div><div><span class="label">${ui('次のアクション','NEXT ACTION')}</span><p>${field(r.next)}</p><details><summary>${ui('詳細・根拠を見る','Details and evidence')}</summary><div class="detail">${bcf?`<p>${field(r.detail)}</p>`:`<p><b>Fit:</b> ${esc(r.fit)}</p><p><b>Sponsorship:</b> ${esc(r.sponsorship)}</p><p><b>Evidence:</b> ${esc(r.evidence)}</p><p>Role review: ${esc(r.evidenceAsOf||data.us.evidenceAsOf)}. Not a fresh availability check.</p>`}</div></details><details class="notes"><summary>${ui('自分のメモ','My notes')}</summary><textarea class="note" data-note="${esc(r.id)}" aria-label="${ui('メモ','Notes')}: ${esc(r.company)}">${esc(note)}</textarea></details></div><div class="timing"><span class="label">${ui('期限・日程','DEADLINE / TIMING')}</span><p class="deadline">${field(r.deadline||'—')}</p>${bcf?`<p class="role">${ui('次の対応: ','Next action: ')}${field(r.owner)}</p>`:`<p class="role">${esc(r.timing)}</p>${r.submittedAt?`<p class="role">Submitted: ${esc(r.submittedAt)}</p>`:''}`}</div></article>`;}).join('')||`<p class="empty">${ui('条件に一致する職種がありません。絞り込みを解除してください。','No positions match. Reset the filters to see all positions.')}</p>`;}
$('unlock-form').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;$('message').textContent='開いています… / Decrypting…';try{data=await decrypt($('password').value);$('password').value='';$('message').textContent='';$('gate').hidden=true;$('app').hidden=false;setup();}catch{$('message').textContent='パスワードまたは接続を確認してください。 / Check your password and connection, then try again.';}finally{b.disabled=false;}});
document.querySelectorAll('[data-page]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();page=a.dataset.page;history.pushState({},'',a.href);setup();window.scrollTo(0,0);}));window.addEventListener('popstate',()=>{page=location.pathname.endsWith('/us.html')?'us':'bcf';if(data)setup();});
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('job-status-language',lang);}catch{}setup();}));$('search').addEventListener('input',render);$('filter').addEventListener('change',render);$('reset').onclick=()=>{$('search').value='';$('filter').value='all';render();};
$('positions').addEventListener('input',e=>{if(e.target.matches('[data-note]'))try{localStorage.setItem(`job-status-note-${page}-${e.target.dataset.note}`,e.target.value);}catch{}});
$('export').onclick=()=>{const fields=page==='bcf'?['company','role','status','deadline','next']:['company','role','applicationStatus','deadline','next'];const quote=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const csv='\ufeff'+[fields.map(quote).join(','),...rowsVisible().map(r=>fields.map(k=>quote(tr(r[k]))).join(','))].join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=`${page}-status.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('lock').onclick=()=>{data=null;for(const id of ['positions','actions','metrics','notice','updated','filter','count','review-status','portal-logins'])$(id).replaceChildren();$('search').value='';$('app').hidden=true;$('gate').hidden=false;$('password').value='';$('password').focus();};
</script></body></html>
